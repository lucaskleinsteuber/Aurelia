# Tarven Server with Docker Compose. Save this file, change the media folder below, then:
#   docker compose run --rm tarven setup
#   docker compose up -d
# See https://github.com/lucaskleinsteuber/Tarven/blob/main/docs/DOCKER.md
services:
  tarven:
    build: https://github.com/lucaskleinsteuber/Tarven.git#main:packaging/docker
    image: tarven-server:local
    container_name: tarven
    # The host's network lets Macs, Apple TVs and phones find the server on their own (Bonjour).
    network_mode: host
    restart: unless-stopped
    volumes:
      - tarven-data:/data
      # Your movies and shows, read-only. Change the left side to your folder.
      - /srv/media:/media:ro
    # A video chip converts titles much faster. Intel or AMD: uncomment both, and put the number
    # from `getent group render | cut -d: -f3` into group_add. Nvidia: see docs/DOCKER.md.
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "993"

volumes:
  tarven-data:
