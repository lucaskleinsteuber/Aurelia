name: Verify Linux app

# Aurelia for Linux on Linux: formatting, a warning-free build and the headless interface tests.
# Linux minutes are the cheapest, so this runs whenever the app or what it shares changes.
on:
  push:
    branches: [main]
    paths:
      - "clients/linux/**"
      - "src/Aurelia.Contracts/**"
      - "scripts/test-linux-app.sh"
      - ".github/workflows/linux-app.yml"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Verify formatting, build and tests
        run: bash scripts/test-linux-app.sh
