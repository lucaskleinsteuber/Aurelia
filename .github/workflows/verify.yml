name: Verify server

# macOS runner minutes are billed at a multiple, so client-only changes skip this server job.
# The Mac version file stays included because the build-number check compares it with the server.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "scripts/**"
      - ".config/**"
      - ".github/workflows/verify.yml"
      - "Aurelia.slnx"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "NuGet.Config"
      - "global.json"
      - "clients/macos/Configuration/BuildNumber.xcconfig"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "scripts/**"
      - ".config/**"
      - ".github/workflows/verify.yml"
      - "Aurelia.slnx"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "NuGet.Config"
      - "global.json"
      - "clients/macos/Configuration/BuildNumber.xcconfig"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    # Exercise the bundled Skia/macOS image processing dependencies too.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Install verification prerequisites
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            brew install ripgrep
          fi
          rg --version
      - name: Verify version, formatting, build, and tests
        run: |
          scripts/verify-build-number.sh
          sh scripts/verify-product-names.sh
          dotnet tool restore
          dotnet restore Aurelia.slnx
          dotnet format Aurelia.slnx --verify-no-changes --no-restore
          dotnet build Aurelia.slnx --configuration Release --no-restore
          dotnet test Aurelia.slnx --configuration Release --no-build
      - name: Verify real-socket TLS, sessions, and Direct Play transport
        run: sh scripts/test-server-transport.sh 30 2
